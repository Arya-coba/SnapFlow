# docker-compose.yml — untuk development lokal dengan Docker
# Penggunaan: docker-compose up --build

version: '3.8'

services:
  snapflow:
    build: .
    ports:
      - "7860:7860"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MODEL_PATH=/app/model/saved_model
      - APP_HOST=0.0.0.0
      - APP_PORT=7860
      - DEBUG=False
    volumes:
      # Persist model dan database agar tidak re-download setiap container restart
      - ./model/saved_model:/app/model/saved_model
      - ./backend/snapflow.db:/app/backend/snapflow.db
    restart: unless-stopped
